<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rectangle Movement</title>

  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#ddd;
      gap:20px;
    }

    .box{
      width:400px;
      height:220px;
      background:white;
      border-radius:10px;
      position:relative;
    }

    .rect{
      width:50px;
      height:50px;
      background:green;
      position:absolute;
      top:10px;
      left:10px;
      border-radius:5px;
    }

    button{
      padding:12px 20px;
      background:black;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-size:18px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="rect" id="rect"></div>
  </div>

  <button onclick="startMove()">Move Rectangle</button>

  <script>
    const rect = document.getElementById("rect");

    function moveRight(callback){
      rect.style.transition = "2s";
      rect.style.left = "340px";

      setTimeout(callback, 2000);
    }

    function moveDown(callback){
      rect.style.transition = "2s";
      rect.style.top = "160px";

      setTimeout(callback, 2000);
    }

    function moveLeft(callback){
      rect.style.transition = "2s";
      rect.style.left = "10px";

      setTimeout(callback, 2000);
    }

    function moveUp(callback){
      rect.style.transition = "2s";
      rect.style.top = "10px";

      setTimeout(callback, 2000);
    }

    function startMove(){
      moveRight(function(){
        moveDown(function(){
          moveLeft(function(){
            moveUp(function(){
              console.log("Movement Finished");
            });
          });
        });
      });
    }
  </script>

</body>
</html>
