<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Contact Management System</title>

<style>
body{
    font-family: Arial;
    margin:20px;
}

input{
    width:300px;
    padding:8px;
    margin:5px;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#f2f2f2;
}
</style>
</head>

<body>

<h2>Student Contact Management System</h2>

<input type="hidden" id="studentId">

<input type="text" id="name" placeholder="Student Name"><br>

<input type="email" id="email" placeholder="Email"><br>

<input type="text" id="phone" placeholder="Phone Number"><br>

<input type="text" id="subject" placeholder="Subject"><br>

<input type="text" id="class" placeholder="Class"><br>

<input type="text" id="roll" placeholder="Roll Number"><br>

<input type="text" id="remark" placeholder="Remark"><br>

<button onclick="addStudent()">Submit</button>
<button onclick="updateStudent()">Update</button>

<h3>Contact us</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Subject</th>
<th>Class</th>
<th>Roll</th>
<th>Remark</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

<script type="module" src="main.js"></script>

</body>
</html>
